services:
  gamepromotions:
    build: .
    restart: unless-stopped
    environment:
      # Set these in Coolify -> the app's Environment Variables.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      MONGODB_URI: ${MONGODB_URI}
      SENTRY_DSN: ${SENTRY_DSN}
      EPIC_GAMES_PROMOTIONS: ${EPIC_GAMES_PROMOTIONS}
      STEAM_PROMOTIONS: ${STEAM_PROMOTIONS}
      GOG_PROMOTIONS: ${GOG_PROMOTIONS}
      # Fire one run at boot instead of waiting up to 4h for the next slot.
      RUN_ON_START: ${RUN_ON_START:-false}
      TZ: UTC
    deploy:
      resources:
        limits:
          # Shared 24 GB box; the job is a handful of HTTP calls.
          memory: 256M
