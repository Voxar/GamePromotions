# .github/workflows/check-games.yml
name: Check Free Games

on:
  # Scheduled runs moved to the self-hosted container (supercronic, see crontab).
  # Re-enabling this alongside the container would double-post.
  # schedule:
  #   - cron: '0 0/4 * * *'
  workflow_dispatch:

jobs:
  check-games:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        EPIC_GAMES_PROMOTIONS: ${{ secrets.EPIC_GAMES_PROMOTIONS }}
        STEAM_PROMOTIONS: ${{ secrets.STEAM_PROMOTIONS }}
        GOG_PROMOTIONS: ${{ secrets.GOG_PROMOTIONS }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: python main.py